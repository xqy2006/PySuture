name: Publish PySuture prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prerelease tag; must equal v plus the version in pyproject.toml
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pysuture-prerelease
  cancel-in-progress: false

jobs:
  package-and-publish:
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate prerelease request
        shell: pwsh
        run: |
          python -m pip install --upgrade build packaging twine
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:RELEASE_TAG -ne "v$version") { throw "tag must be exactly v$version" }
          python -c "from packaging.version import Version; import os; v=Version(os.environ['RELEASE_TAG'][1:]); assert v.is_prerelease or v.is_devrelease, 'stable releases are not permitted by this workflow'"
          $existing = @(gh release list --limit 1000 --json tagName | ConvertFrom-Json | Where-Object { $_.tagName -eq $env:RELEASE_TAG })
          if ($existing.Count -ne 0) { throw "release already exists: $env:RELEASE_TAG" }
      - name: Install and test source tree
        run: |
          python -m pip install -e ".[build,test]"
          python -m compileall -q src tests scripts
          python -m pytest
      - name: Validate reviewed StaticPython catalog
        run: python .\scripts\validate_runtime_catalog.py
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist\*
      - uses: actions/upload-artifact@v4
        with:
          name: pysuture-${{ inputs.tag }}
          path: dist/*
          if-no-files-found: error
      - name: Create GitHub prerelease
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem .\dist -File | Select-Object -ExpandProperty FullName)
          gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "PySuture $env:RELEASE_TAG" --prerelease --generate-notes
