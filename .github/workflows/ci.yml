name: Publish PySuture v0.1.0a1 candidate

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: pysuture-v0.1.0a1-prerelease
  cancel-in-progress: false

jobs:
  package-and-publish:
    if: ${{ github.event.pull_request.head.ref == 'release/pysuture-0.1.0a1' }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RELEASE_TAG: v0.1.0a1
      SOURCE_COMMIT: dfd06334f9f802f78b0489f86fca191cb3956e31
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate immutable prerelease target
        shell: pwsh
        run: |
          if ($env:GITHUB_BASE_REF -ne "feature/foundation") {
            throw "release validation PR must target feature/foundation"
          }
          if ((git rev-parse HEAD) -ne $env:SOURCE_COMMIT) {
            throw "checkout does not match audited source commit"
          }
          python -m pip install --upgrade build packaging twine
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "tag must be exactly v$version"
          }
          python -c "from packaging.version import Version; import os; v=Version(os.environ['RELEASE_TAG'][1:]); assert v.is_prerelease, 'stable releases are not permitted'"
          $release = gh release view $env:RELEASE_TAG --json isDraft,isPrerelease,targetCommitish,assets | ConvertFrom-Json
          if ($release.isDraft -or -not $release.isPrerelease) {
            throw "release must be a published prerelease"
          }
          if ($release.targetCommitish -ne $env:SOURCE_COMMIT) {
            throw "release target does not match audited source commit"
          }
      - name: Test source tree
        run: |
          python -m pip install -e ".[build,test]"
          python -m compileall -q src tests scripts
          python -m pytest
      - name: Validate reviewed StaticPython catalog
        run: python .\scripts\validate_runtime_catalog.py
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check dist\*
      - uses: actions/upload-artifact@v4
        with:
          name: pysuture-v0.1.0a1
          path: dist/*
          if-no-files-found: error
      - name: Upload and verify immutable release assets
        shell: pwsh
        run: |
          $files = @(Get-ChildItem .\dist -File | Sort-Object Name)
          if ($files.Count -ne 2) {
            throw "expected exactly wheel and sdist, got $($files.Count) files"
          }
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          $remote = @{}
          foreach ($asset in @($release.assets)) {
            $remote[$asset.name] = $asset
          }
          foreach ($file in $files) {
            $digest = "sha256:$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            if ($remote.ContainsKey($file.Name)) {
              if ($remote[$file.Name].digest -ne $digest) {
                throw "existing asset digest mismatch for $($file.Name)"
              }
              Write-Host "verified existing $($file.Name)"
              continue
            }
            gh release upload $env:RELEASE_TAG $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "failed to upload $($file.Name)"
            }
          }
          $verified = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if (@($verified.assets).Count -ne $files.Count) {
            throw "release has an unexpected asset count"
          }
          foreach ($file in $files) {
            $digest = "sha256:$((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
            $asset = @($verified.assets | Where-Object name -eq $file.Name)
            if ($asset.Count -ne 1 -or $asset[0].digest -ne $digest) {
              throw "published asset verification failed for $($file.Name)"
            }
          }
