name: PySuture CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install locked build frontend
        run: python -m pip install -e ".[build,test]"
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: python -m pytest
      - name: CLI smoke
        run: pysuture --help

  windows-toolchain:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[build]"
      - name: Verify VS 2022 and Windows SDK discovery
        run: pysuture doctor --json
